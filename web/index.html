<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trading Journal</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#1b2430;--mute:#66758a;--line:#d8dee7;--win:#0f7b6c;--loss:#c4384b;--accent:#2f5fd0;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141a24;--panel:#1c2431;--ink:#e6ebf2;--mute:#8d9bb0;--line:#2c3646;--win:#3fc4ac;--loss:#ef6b7d;--accent:#7a9cf5;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "IBM Plex Sans Thai",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
h1{font-size:21px;margin:0}h2{font-size:16px;margin:0 0 10px}
button,select,input,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
nav{display:flex;gap:6px;flex-wrap:wrap}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.hero{display:grid;grid-template-columns:1fr 280px;gap:24px}
.net{font-size:38px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.mute{color:var(--mute)}.win{color:var(--win)}.loss{color:var(--loss)}
.chart{position:relative;height:280px}
dl{margin:0;display:grid;grid-template-columns:1fr auto;align-content:start}
dt,dd{margin:0;padding:7px 0;border-bottom:1px solid var(--line)}dd{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}dt{color:var(--mute)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}th{color:var(--mute);font-weight:400}.r{text-align:right}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{color:var(--mute);text-align:center;font-size:13px}
.day{min-height:68px;border-radius:6px;padding:4px 6px;font-size:12px;border:1px solid var(--line)}
.day b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.ins li{margin-bottom:6px}
details{border-bottom:1px solid var(--line);padding:8px 0}summary{cursor:pointer;display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.form label{display:flex;flex-direction:column;gap:3px;color:var(--mute);font-size:13px}.form .full{grid-column:1/-1}
textarea{min-height:70px;resize:vertical}
#login{max-width:340px;margin:80px auto;display:flex;flex-direction:column;gap:10px}
@media(max-width:800px){.hero,.form{grid-template-columns:1fr}.net{font-size:30px}.day{min-height:54px;padding:2px 3px}}
</style>
</head>
<body>
<main>
<form id="login" class="panel" hidden>
  <h1>Trading Journal</h1>
  <input id="em" type="email" placeholder="อีเมล" autocomplete="username" required>
  <input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" required>
  <button class="on">เข้าสู่ระบบ</button>
  <div id="err" class="loss"></div>
</form>

<div id="app" hidden>
<header>
  <h1>Trading Journal</h1>
  <nav id="tabs"></nav>
  <span><select id="acct" hidden></select> <select id="range"><option value="7">7 วัน</option><option value="30" selected>30 วัน</option><option value="90">90 วัน</option><option value="0">ทั้งหมด</option></select>
  <button id="out">ออกจากระบบ</button></span>
</header>
<div id="view"></div>
</div>
</main>

<script>
const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const TABS = {overview: "ภาพรวม", calendar: "ปฏิทิน", analysis: "จุดแข็ง-จุดอ่อน", journal: "บันทึกรีวิว"};
const WD = ["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสฯ","ศุกร์","เสาร์"];
let T = [], tab = "overview", calMonth = new Date(), chart;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const m = v => (v > 0 ? "+" : v < 0 ? "-" : "") + Math.abs(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const cl = v => v >= 0 ? "win" : "loss";
const fd = s => s == null ? "-" : s < 3600 ? Math.round(s / 60) + " นาที" : Math.floor(s / 3600) + " ชม. " + Math.round(s % 3600 / 60) + " นาที";
const bkk = t => new Date(new Date(t).getTime() + 7 * 3600e3);   // แสดงผลเป็นเวลาไทย (UTC+7)
const sum = (a, f) => a.reduce((s, x) => s + f(x), 0);
const avg = (a, f) => a.length ? sum(a, f) / a.length : null;

function prep(x) {
  const o = bkk(x.open_time), c = bkk(x.close_time);
  return {...x, n: +x.net_profit, g: +x.profit, cost: +x.commission + +x.swap + +x.fee,
    dur: (new Date(x.close_time) - new Date(x.open_time)) / 1000,
    day: c.toISOString().slice(0, 10), oh: o.getUTCHours(), wd: o.getUTCDay(), ct: c.toISOString().slice(0, 16).replace("T", " ")};
}

function stat(a) {
  const w = a.filter(x => x.n > 0), l = a.filter(x => x.n < 0), gw = sum(w, x => x.n), gl = -sum(l, x => x.n);
  return {n: a.length, net: gw - gl, wr: a.length ? w.length / a.length * 100 : 0, pf: gl ? gw / gl : gw ? Infinity : 0,
    avg: a.length ? (gw - gl) / a.length : 0, avgW: avg(w, x => x.n) || 0, avgL: avg(l, x => x.n) || 0,
    d: avg(a, x => x.dur), dw: avg(w, x => x.dur), dl: avg(l, x => x.dur)};
}
function group(a, key) {
  const g = {}; a.forEach(x => (g[key(x)] ??= []).push(x));
  return Object.entries(g).map(([k, v]) => ({k, ...stat(v)}));
}

async function load() {
  let all = [], from = 0;
  for (;;) {
    const {data, error} = await sb.from("trades").select("*").order("close_time").range(from, from + 999);
    if (error) { $("view").innerHTML = `<div class="panel loss">โหลดข้อมูลไม่ได้: ${esc(error.message)}</div>`; return; }
    all = all.concat(data); if (data.length < 1000) break; from += 1000;
  }
  T = all.map(prep); fillAccts(); render();
}

function fillAccts() {
  const s = $("acct"), cur = s.value, names = [...new Set(T.map(x => x.account))].sort();
  s.innerHTML = '<option value="">ทุกบัญชี</option>' + names.map(n => `<option ${n === cur ? "selected" : ""}>${esc(n)}</option>`).join("");
  s.hidden = names.length < 2;
}
const scope = () => T.filter(x => !$("acct").value || x.account === $("acct").value);
const filtered = () => { const d = +$("range").value; const cut = d ? Date.now() - d * 864e5 : 0; return scope().filter(x => new Date(x.close_time) >= cut); };

function render() {
  $("tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${v}</button>`).join("");
  const F = filtered(), v = $("view");
  if (!T.length) { v.innerHTML = `<div class="panel mute">ยังไม่มีข้อมูล รัน mt5_sync.py บนเครื่องที่เปิด MT5 แล้วรอสักครู่</div>`; return; }
  ({overview, calendar, analysis, journal}[tab])(F, v);
}

function overview(F, v) {
  const s = stat(F);
  let eq = 0, pk = 0, dd = 0; F.forEach(x => { eq += x.n; pk = Math.max(pk, eq); dd = Math.max(dd, pk - eq); });
  const rows = [
    ["กำไรขั้นต้น (ก่อนหักค่าใช้จ่าย)", m(sum(F, x => x.g))],
    ["ค่าคอมมิชชัน", m(sum(F, x => +x.commission))], ["ค่าสวอป", m(sum(F, x => +x.swap))], ["ค่าธรรมเนียมอื่น", m(sum(F, x => +x.fee))],
    ["กำไรจริงเฉลี่ยต่อไม้ (หักทุกอย่าง)", m(s.avg)], ["Win rate", s.wr.toFixed(1) + "%"],
    ["Profit factor", s.pf === Infinity ? "∞" : s.pf.toFixed(2)], ["เฉลี่ยไม้ชนะ", m(s.avgW)], ["เฉลี่ยไม้แพ้", m(s.avgL)],
    ["Max drawdown", "-" + Math.abs(dd).toFixed(2)], ["ถือเฉลี่ยทุกไม้", fd(s.d)], ["ถือเฉลี่ยไม้ชนะ", fd(s.dw)], ["ถือเฉลี่ยไม้แพ้", fd(s.dl)]];
  v.innerHTML = `<div class="panel hero"><div><div class="mute">กำไรจริงสุทธิ (หักค่าทุกอย่างแล้ว) · ${s.n} ไม้</div>
    <div class="net ${cl(s.net)}">${m(s.net)}</div><div class="chart"><canvas id="eq"></canvas></div></div>
    <dl>${rows.map(r => `<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join("")}</dl></div>`;
  let c = 0; chart?.destroy();
  const tick = {color: getComputedStyle(document.body).getPropertyValue("--mute")}, grid = {color: getComputedStyle(document.body).getPropertyValue("--line")};
  chart = new Chart($("eq"), {type: "line", data: {labels: F.map(x => x.ct), datasets: [{data: F.map(x => +(c += x.n).toFixed(2)), borderColor: "#2f5fd0", borderWidth: 2, pointRadius: 0, tension: .15}]},
    options: {maintainAspectRatio: false, plugins: {legend: {display: false}}, scales: {x: {ticks: {...tick, maxTicksLimit: 6}, grid: {display: false}}, y: {ticks: tick, grid}}}});
}

function calendar(_, v) {
  const y = calMonth.getFullYear(), mo = calMonth.getMonth(), days = new Date(y, mo + 1, 0).getDate(), first = new Date(y, mo, 1).getDay();
  const key = d => `${y}-${String(mo + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
  const byDay = {}; scope().forEach(x => { if (x.day.startsWith(key(1).slice(0, 7))) (byDay[x.day] ??= []).push(x); });
  const maxAbs = Math.max(1, ...Object.values(byDay).map(a => Math.abs(sum(a, x => x.n))));
  const tot = stat(Object.values(byDay).flat());
  let cells = WD.map(d => `<div class="h">${d.slice(0, 2)}</div>`).join("") + "<div></div>".repeat(first);
  for (let d = 1; d <= days; d++) {
    const a = byDay[key(d)], net = a ? sum(a, x => x.n) : 0;
    const bg = a ? `background:color-mix(in srgb, var(--${net >= 0 ? "win" : "loss"}) ${15 + 50 * Math.abs(net) / maxAbs}%, var(--panel))` : "";
    cells += `<div class="day" style="${bg}">${d}${a ? `<b>${m(net)}</b><span class="mute">${a.length} ไม้</span>` : ""}</div>`;
  }
  v.innerHTML = `<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
    <span><button data-m="-1">‹</button> <b>${calMonth.toLocaleDateString("th-TH", {month: "long", year: "numeric"})}</b> <button data-m="1">›</button></span>
    <span>รวมเดือนนี้ <b class="${cl(tot.net)}">${m(tot.net)}</b> · ${tot.n} ไม้ · Win ${tot.wr.toFixed(0)}%</span></div><div class="cal">${cells}</div></div>`;
}

function tbl(title, rows, label) {
  return `<div class="panel scroll"><h2>${title}</h2><table><thead><tr><th>กลุ่ม</th><th class="r">ไม้</th><th class="r">กำไรสุทธิ</th><th class="r">Win%</th><th class="r">เฉลี่ย/ไม้</th><th class="r">ถือเฉลี่ย</th><th class="r">ถือ (ชนะ)</th><th class="r">ถือ (แพ้)</th></tr></thead><tbody>${
    rows.map(r => `<tr><td>${esc(label(r.k))}</td><td class="r">${r.n}</td><td class="r ${cl(r.net)}">${m(r.net)}</td><td class="r">${r.wr.toFixed(0)}%</td><td class="r ${cl(r.avg)}">${m(r.avg)}</td><td class="r">${fd(r.d)}</td><td class="r">${fd(r.dw)}</td><td class="r">${fd(r.dl)}</td></tr>`).join("")}</tbody></table></div>`;
}

function analysis(F, v) {
  const acc = group(F, x => x.account), sym = group(F, x => x.symbol).sort((a, b) => b.net - a.net), side = group(F, x => x.side).sort((a, b) => b.net - a.net);
  const hr = group(F, x => String(x.oh).padStart(2, "0")).sort((a, b) => a.k - b.k), wd = group(F, x => x.wd).sort((a, b) => a.k - b.k);
  const cand = [...sym.map(r => ["คู่/สัญลักษณ์ " + r.k, r]), ...side.map(r => ["ฝั่ง " + r.k.toUpperCase(), r]),
    ...hr.map(r => [`เข้าไม้ช่วง ${r.k}:00-${r.k}:59 น.`, r]), ...wd.map(r => ["วัน" + WD[r.k], r])].filter(([, r]) => r.n >= 5).sort((a, b) => b[1].avg - a[1].avg);
  const li = ([t, r]) => `<li><b>${esc(t)}</b>: เฉลี่ย <span class="${cl(r.avg)}">${m(r.avg)}</span>/ไม้ · ${r.n} ไม้ · Win ${r.wr.toFixed(0)}% · ถือเฉลี่ย ${fd(r.d)}</li>`;
  const good = cand.filter(c => c[1].avg > 0).slice(0, 4), bad = cand.filter(c => c[1].avg < 0).slice(-4).reverse();
  v.innerHTML = `<div class="panel ins"><h2>สรุปอัตโนมัติ <span class="mute" style="font-weight:400;font-size:13px">(เฉพาะกลุ่มที่มี ≥ 5 ไม้ · เวลาไทย)</span></h2>
    <b class="win">จุดแข็ง</b><ul>${good.map(li).join("") || "<li class='mute'>ยังไม่มีกลุ่มที่กำไรและมีไม้พอ</li>"}</ul>
    <b class="loss">จุดอ่อน</b><ul>${bad.map(li).join("") || "<li class='mute'>ยังไม่มีกลุ่มที่ขาดทุนและมีไม้พอ</li>"}</ul></div>` +
    (acc.length > 1 ? tbl("แยกตามบัญชี", acc.sort((a, b) => b.net - a.net), k => k) : "") + tbl("แยกตามคู่เงิน/สัญลักษณ์", sym, k => k) + tbl("แยกตามฝั่ง Buy / Sell", side, k => k.toUpperCase()) +
    tbl("แยกตามชั่วโมงที่เข้าไม้ (เวลาไทย) · ดูความเร็วในการปิดกำไร/ขาดทุน", hr, k => k + ":00") + tbl("แยกตามวัน", wd, k => WD[k]);
}

function journal(F, v) {
  const only = $("onlyNew")?.checked ?? false;
  const list = F.slice().reverse().filter(x => !only || !x.reviewed).slice(0, 100);
  v.innerHTML = `<div class="panel"><div style="display:flex;justify-content:space-between;margin-bottom:8px"><h2>รีวิวทีละออเดอร์</h2>
    <label><input type="checkbox" id="onlyNew" ${only ? "checked" : ""}> เฉพาะที่ยังไม่รีวิว</label></div>` +
    (list.map(x => `<details><summary><span class="mute">${x.ct}</span><span class="mute">${esc(x.account)}</span><b>${esc(x.symbol)}</b><span class="${x.side === "buy" ? "win" : "loss"}">${x.side.toUpperCase()}</span>
      <b class="${cl(x.n)}">${m(x.n)}</b><span class="mute">${fd(x.dur)}</span>${x.reviewed ? "✓ รีวิวแล้ว" : ""}</summary>
      <div class="mute" style="margin-top:6px">ขั้นต้น ${m(x.g)} · คอมมิชชัน ${m(+x.commission)} · สวอป ${m(+x.swap)} · อื่นๆ ${m(+x.fee)} = <b class="${cl(x.n)}">กำไรจริง ${m(x.n)}</b></div>
      <div class="form" data-id="${x.id}" data-acc="${esc(x.account)}">
        <label>Setup / กลยุทธ์<input name="setup" value="${esc(x.setup)}"></label>
        <label>คุณภาพการเทรด (1-5)<select name="rating"><option value="">-</option>${[1,2,3,4,5].map(n => `<option ${x.rating == n ? "selected" : ""}>${n}</option>`).join("")}</select></label>
        <label class="full">เหตุผลที่เข้าไม้<textarea name="entry_reason">${esc(x.entry_reason)}</textarea></label>
        <label>ข้อผิดพลาด<textarea name="mistake">${esc(x.mistake)}</textarea></label>
        <label>บทเรียน / ครั้งหน้าจะทำอย่างไร<textarea name="lesson">${esc(x.lesson)}</textarea></label>
        <div class="full"><button class="on" data-save>บันทึก</button> <span class="mute" data-msg></span></div></div></details>`).join("") || `<div class="mute">ไม่มีรายการ</div>`) + `</div>`;
}

document.addEventListener("click", async e => {
  const t = e.target;
  if (t.dataset.t) { tab = t.dataset.t; render(); }
  if (t.dataset.m) { calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + +t.dataset.m, 1); render(); }
  if (t.dataset.save !== undefined) {
    const f = t.closest(".form"), id = f.dataset.id, acc = f.dataset.acc, g = n => f.querySelector(`[name=${n}]`).value.trim() || null;
    const patch = {setup: g("setup"), entry_reason: g("entry_reason"), mistake: g("mistake"), lesson: g("lesson"), rating: g("rating") ? +g("rating") : null, reviewed: true};
    const {error} = await sb.from("trades").update(patch).eq("id", id).eq("account", acc);
    f.querySelector("[data-msg]").textContent = error ? "ผิดพลาด: " + error.message : "บันทึกแล้ว";
    if (!error) Object.assign(T.find(x => x.id == id && x.account === acc), patch);
  }
});
document.addEventListener("change", e => { if (e.target.id === "onlyNew") render(); });
$("range").onchange = render; $("acct").onchange = render;
$("out").onclick = async () => { await sb.auth.signOut(); location.reload(); };
$("login").onsubmit = async e => {
  e.preventDefault();
  const {error} = await sb.auth.signInWithPassword({email: $("em").value, password: $("pw").value});
  if (error) $("err").textContent = "เข้าสู่ระบบไม่สำเร็จ: " + error.message; else start();
};
async function start() {
  const {data} = await sb.auth.getSession();
  $("login").hidden = !!data.session; $("app").hidden = !data.session;
  if (data.session) { await load(); setInterval(() => { if (tab !== "journal") load(); }, 60000); }
}
start();
</script>
</body>
</html>
